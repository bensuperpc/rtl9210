; Read the full guide before proceeding.
; Use the dump feature to read and SAVE the original settings before flashing/updating for the first time, as this WILL overwrite your existing settings.
; Subsequent dumps will only read the currently loaded settings. Consider contributing original dumps not already included in the project!
; Familiarize yourself with the unbrick procedure before flashing in case of failure.
; Consider making sure the required chip and pins are identified and easily accessible beforehand in case of failure, or accept risk, 
; as some enclosure designs might require more effort or destructive methods to access it. 

;Configure Start
;=================FW Configure=================
;U2PHY = n/a
;U3PHY = n/a

; Vendor Id 0x0bda: Realtek Semiconductor Corp.
VID = 0x0bda
; Product Id 0x9210: RTL9210 M.2 NVME Adapter
PID = 0x9210

; Used for device identification, inspection/diagnostic tools. Visibility not apparent during normal use. Up to 15 characters.
MANUFACTURE = "Realtek"
; Sets the name shown in Windows safely remove and eject. "RTL9200" if left blank or commented out. Up to 31 characters.
PRODUCT = "RTL9210"

; Contributes to the first part of the visible Device Manager name. Up to 8 characters.
; When SCSI_VENDOR and SCSI_PRODUCT are unset, it passes through drive info, when only vendor set it passes RTL9210 as product/suffix.
SCSI_VENDOR = "Realtek "

; Contributes to the second part of the visible Device Manager name. Up to 16 characters
; When SCSI_VENDOR and SCSI_PRODUCT are unset, it passes through drive info, when only scsi product is set it passes Realtek as vendor/prefix
SCSI_PRODUCT = "RTL9210 NVME    "

; Set to original dumped value if available.
SERIAL = "012345678910"

; 0x0 tells the computer to supply the power through the USB cable, 0x1 tells the computer it uses its own power source (like a wall adapter)
;USB_SELF_PWR = n/a

; 0x0 expects the SSD to stay permanently attached.
;DISK_HOTPLUG = n/a

; 0x1 the led light turns on as soon as plugged in, 0x0 the led light stays off when when plugged in.
LED = 0x01

;PINMUX1 = n/a
;PINMUX2 = n/a

; USB 2.0 mode maximum power, 0xfa is equal to 2.5w, standard common value.
;U2_MAXPWR = n/a
; USB 3.0 mode maximum power, 0x70 is equal to 4.5w, standard common value.
;U3_MAXPWR = n/a

; Active State Power Management Disable: 0x0 allows drop in power and performance when not in use, may cause small delay when waking from idle state, for everyday use/storage. 0x1 device maintains high power and performance, may get hot, for running operating systems where power management could cause crashes/freezing.
;ASPMDIS = n/a

; PCIe Reference Clock
;PCIE_REFCLK = n/a

; Newer intelligent power saving, 0x00 is off, 0x01 is 1, 0xa is 10, 0x1E is 30, minutes of idle time will power down storage/drive.
;DISK_IPS_THRES = n/a

;SWR_1_2V = n/a
;EN_UPS = n/a

;PD = n/a

; CUSTOMIZED_LED 15 bytes, original was n/a, 01 01 is breathing led when idle.
;CUSTOMIZED_LED = n/a

;SUSPEND_LED_OFF = 
;FORCE_USB_SPEED = n/a
;FORCE_PCIE_SPEED = n/a

; 0x1 to enable USB 3.0 Link Power Management, lower power states, 0x0 disable.
;EN_U1U2 = n/a

;FORCE_USB_QUIRK = n/a
;FORCE_PCIE_QUIRK = n/a
;FAN = n/a

; Behavior appears inverted vs. guide: Win10: 0x0 or uncommented shows up on This PC, 0x1 shows uninitialized in Disk Management, MPTool flashing tool detects both.
;DIS_SHOW_EMPTY_DISK = n/a

;FORCE_SATA_NORMAL_DMA = n/a
UART_DBG_PIN = 0x05
;FINGER_PRINT_EN = n/a

;RM_INTERNAL_RD = n/a
;HS_AUTO_SWITCH = n/a
;UART_BAUD_RATE = n/a
;CUSTOMIZED_DISK_IDENTIFY = n/a
;HW_LED_CFG = n/a
;CDROM_CFG = n/a
;SUPPORT_HID = n/a

; Delays the SSD drive startup so the USB controller can connect first, 
; improves compatibility, and may reduce power spikes and unrecognized drive errors for low power devices. 
; Testing showed persistent 35% reduced read speeds, occasional issues with Virtual Machines within Win10, occasional disconnects.   
;LATE_INIT_DISK = n/a

;SCSI_WP_PIN = n/a
;SD_MMC_TYPE = n/a
;FORCE_PORT_TYPE = n/a
;BCDDEVICE = n/a
;SUSPEND_DISK_OFF = n/a
;SCSI_WB_PIN = n/a
;CUSTOMIZED_FEATURE = n/a
;PERIPH_API = n/a
;RAID_CFG = n/a

; The following settings may need to be set manually in the program.
; Testing indicates they do not change when configured here.
;=================Tool Configure=================
;DISCONN_FORCE_USB2 = n
;FORMAT_DISK = n
;INC_SERIAL = n

;PARTITION: GPT, MBR
PARTITION = "MBR"
;FORMAT: NTFS, exFAT
FORMAT = "NTFS"
;LABEL max allowed - characters
LABEL = "My USB"
